name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Build Tools
      run: |
        sdkmanager "build-tools;33.0.0"
        sdkmanager "platforms;android-33"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean previous builds
      run: ./gradlew clean --no-daemon

    - name: Create real assets and icons
      run: |
        # 安装 Pillow
        pip install Pillow
        
        # 创建游戏资源目录
        mkdir -p android/assets/textures
        mkdir -p android/assets/sounds
        mkdir -p android/assets/music
        mkdir -p android/assets/fonts
        
        # 生成真实的游戏资源图片
        python3 -c "
from PIL import Image
# 菜单背景（绿色渐变山脉）
img = Image.new('RGB', (1920, 1080), (34, 139, 34))
pixels = img.load()
for y in range(1080):
    for x in range(1920):
        if y > 600:
            g = 139 - int((y - 600) / 480 * 80)
            pixels[x, y] = (20, max(g, 60), 20)
img.save('android/assets/textures/menu_bg.png')

# 地图缩略图（蓝色山峰）
img = Image.new('RGB', (512, 512), (70, 130, 180))
pixels = img.load()
for y in range(512):
    for x in range(512):
        cx, cy = 256, 400
        dist = ((x-cx)**2 + (y-cy)**2) ** 0.5
        if dist < 200 and y < cy:
            h = 1 - dist / 200
            if y < cy - h * 150:
                g = int(200 + h * 55)
                pixels[x, y] = (34, min(g, 255), 34)
img.save('android/assets/textures/map_houshan.png')
print('Game assets created')
"
        
        # 创建 Android 应用图标（使用 Pillow）
        python3 -c "
from PIL import Image, ImageDraw
sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
for name, size in sizes.items():
    import os
    os.makedirs(f'android/src/main/res/mipmap-{name}', exist_ok=True)
    
    img = Image.new('RGBA', (size, size), (76, 175, 80, 255))
    draw = ImageDraw.Draw(img)
    
    # 画白色山峰
    margin = size // 8
    peak_x = size // 2
    peak_y = margin + size // 10
    base_left = margin
    base_right = size - margin
    base_y = size - margin
    
    draw.polygon([(peak_x, peak_y), (base_left, base_y), (base_right, base_y)], fill=(255, 255, 255, 255))
    
    # 山顶雪花
    snow_size = max(size // 15, 2)
    draw.ellipse([peak_x - snow_size, peak_y - snow_size, peak_x + snow_size, peak_y + snow_size], fill=(255, 255, 255, 200))
    
    img.save(f'android/src/main/res/mipmap-{name}/ic_launcher.png')
    print(f'Icon {name}: {size}x{size}')
"
        
        # 创建空音频文件（占位）
        touch android/assets/sounds/button_click.mp3
        touch android/assets/sounds/climb.mp3
        touch android/assets/sounds/summit.mp3
        touch android/assets/music/bgm.mp3

    - name: Build Debug APK
      run: ./gradlew android:assembleDebug --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/build/outputs/apk/debug/android-debug.apk

    - name: Build Release APK
      run: ./gradlew android:assembleRelease --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/build/outputs/apk/release/android-release-unsigned.apk

    - name: Display APK Info
      run: |
        echo "=== Debug APK ==="
        ls -lh android/build/outputs/apk/debug/
        echo "=== Release APK ==="
        ls -lh android/build/outputs/apk/release/
