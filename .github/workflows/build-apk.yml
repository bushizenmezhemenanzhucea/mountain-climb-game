name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Build Tools
      run: |
        sdkmanager "build-tools;33.0.0"
        sdkmanager "platforms;android-33"

    - name: Install Pillow and create assets
      run: |
        pip install Pillow
        python3 scripts/create-assets.py

    - name: Download and extract LibGDX native libraries
      run: |
        echo "=== Downloading native libraries ==="
        GDX_VER="1.12.1"
        JNI_DIR="android/src/main/jniLibs"
        mkdir -p $JNI_DIR/armeabi-v7a $JNI_DIR/arm64-v8a
        
        curl -L -o /tmp/gdx-v7a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-platform/${GDX_VER}/gdx-platform-${GDX_VER}-natives-armeabi-v7a.jar"
        unzip -o /tmp/gdx-v7a.jar -d /tmp/gdx-v7a/ 2>/dev/null || true
        if [ -f /tmp/gdx-v7a/libgdx.so ]; then cp /tmp/gdx-v7a/libgdx.so $JNI_DIR/armeabi-v7a/; echo "OK: gdx armeabi-v7a"; else echo "MISSING: gdx armeabi-v7a"; fi
        
        curl -L -o /tmp/gdx-v8a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-platform/${GDX_VER}/gdx-platform-${GDX_VER}-natives-arm64-v8a.jar"
        unzip -o /tmp/gdx-v8a.jar -d /tmp/gdx-v8a/ 2>/dev/null || true
        if [ -f /tmp/gdx-v8a/libgdx.so ]; then cp /tmp/gdx-v8a/libgdx.so $JNI_DIR/arm64-v8a/; echo "OK: gdx arm64-v8a"; else echo "MISSING: gdx arm64-v8a"; fi
        
        curl -L -o /tmp/bullet-v7a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-bullet-platform/${GDX_VER}/gdx-bullet-platform-${GDX_VER}-natives-armeabi-v7a.jar"
        unzip -o /tmp/bullet-v7a.jar -d /tmp/bullet-v7a/ 2>/dev/null || true
        if [ -f /tmp/bullet-v7a/libgdx-bullet.so ]; then cp /tmp/bullet-v7a/libgdx-bullet.so $JNI_DIR/armeabi-v7a/; echo "OK: bullet armeabi-v7a"; else echo "MISSING: bullet armeabi-v7a"; fi
        
        curl -L -o /tmp/bullet-v8a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-bullet-platform/${GDX_VER}/gdx-bullet-platform-${GDX_VER}-natives-arm64-v8a.jar"
        unzip -o /tmp/bullet-v8a.jar -d /tmp/bullet-v8a/ 2>/dev/null || true
        if [ -f /tmp/bullet-v8a/libgdx-bullet.so ]; then cp /tmp/bullet-v8a/libgdx-bullet.so $JNI_DIR/arm64-v8a/; echo "OK: bullet arm64-v8a"; else echo "MISSING: bullet arm64-v8a"; fi
        
        curl -L -o /tmp/ft-v7a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-freetype-platform/${GDX_VER}/gdx-freetype-platform-${GDX_VER}-natives-armeabi-v7a.jar"
        unzip -o /tmp/ft-v7a.jar -d /tmp/ft-v7a/ 2>/dev/null || true
        if [ -f /tmp/ft-v7a/libgdx-freetype.so ]; then cp /tmp/ft-v7a/libgdx-freetype.so $JNI_DIR/armeabi-v7a/; echo "OK: freetype armeabi-v7a"; else echo "MISSING: freetype armeabi-v7a"; fi
        
        curl -L -o /tmp/ft-v8a.jar "https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-freetype-platform/${GDX_VER}/gdx-freetype-platform-${GDX_VER}-natives-arm64-v8a.jar"
        unzip -o /tmp/ft-v8a.jar -d /tmp/ft-v8a/ 2>/dev/null || true
        if [ -f /tmp/ft-v8a/libgdx-freetype.so ]; then cp /tmp/ft-v8a/libgdx-freetype.so $JNI_DIR/arm64-v8a/; echo "OK: freetype arm64-v8a"; else echo "MISSING: freetype arm64-v8a"; fi
        
        echo "=== Native libs summary ==="
        find $JNI_DIR -type f | sort

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew android:assembleDebug --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Build Release APK
      run: ./gradlew android:assembleRelease --no-daemon
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/build/outputs/apk/debug/android-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/build/outputs/apk/release/android-release-unsigned.apk
